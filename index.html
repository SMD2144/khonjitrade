<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
  <meta name="theme-color" content="#0f1115"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="دفتر طلا"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icon-192.svg"/>
  <link rel="stylesheet" href="styles.css?v=166"/>
  <title>دفتر معاملات طلا</title>

<style id="dashboardCritical165">
.dashboardV164 .dashboardTopV164{
  display:grid !important;
  grid-template-columns:minmax(0,44fr) minmax(0,56fr) !important;
  gap:12px !important;
  align-items:start !important;
  width:100% !important;
  direction:ltr !important;
}
.dashboardV164 .dashboardStatusColV164{
  grid-column:1 !important;
  grid-row:1 !important;
  min-width:0 !important;
  direction:rtl !important;
  order:0 !important;
}
.dashboardV164 .dashboardStatsColV164{
  grid-column:2 !important;
  grid-row:1 !important;
  min-width:0 !important;
  direction:rtl !important;
  order:0 !important;
}
.dashboardV164 .statsGridV164{
  display:grid !important;
  grid-template-columns:repeat(2,minmax(0,1fr)) !important;
  gap:10px !important;
}
.dashboardV164 .statsGridV164 .balanceWideV164{
  grid-column:1 / -1 !important;
}
.dashboardV164 .quickSectionV164{
  display:block !important;
  width:100% !important;
  margin-top:18px !important;
  clear:both !important;
}
@media (max-width:699px){
  .dashboardV164 .dashboardTopV164{
    grid-template-columns:1fr !important;
  }
  .dashboardV164 .dashboardStatusColV164{
    grid-column:1 !important;
    grid-row:1 !important;
  }
  .dashboardV164 .dashboardStatsColV164{
    grid-column:1 !important;
    grid-row:2 !important;
  }
}
</style>


<style id="dashboardCritical166">
.dashboardV164 .dashboardTopV164{
  margin-top:-10px !important;
  align-items:start !important;
}
.dashboardV164 .dashboardStatusColV164,
.dashboardV164 .dashboardStatsColV164{
  margin-top:0 !important;
  align-self:start !important;
}
.dashboardV164 .dashboardStatusColV164 > .sectionTitle,
.dashboardV164 .dashboardStatsColV164 > .sectionTitle{
  margin-top:0 !important;
}
.dashboardV164 .dashboardStatusColV164 .sideTitle{
  margin-top:0 !important;
  line-height:1.15 !important;
}

/* Keep both top blocks visually aligned on the same baseline. */
.dashboardV164 .dashboardStatusColV164,
.dashboardV164 .dashboardStatsColV164{
  padding-top:0 !important;
}

@media (min-width:700px) and (orientation:portrait){
  .dashboardV164 .dashboardTopV164{
    margin-top:-12px !important;
  }
}
@media (min-width:900px) and (orientation:landscape){
  .dashboardV164 .dashboardTopV164{
    margin-top:-10px !important;
  }
}
</style>

</head>
<body>
<div id="app">
  <header class="topbar">
    <div>
      <h1>دفتر معاملات طلا</h1>
      <p>ثبت سریع، دفتر روزانه و بالانس</p>
    </div>
    <button id="themeBtn" class="iconBtn">◐</button>
  <div id="appVersionBadge" class="versionBadge">v1.6.6</div></header>

  <main id="view"></main>

  <nav class="bottomNav">
    <button data-view="dashboard">داشبورد</button>
    <button data-view="report">گزارش</button>
    <button data-view="entry" class="primaryNav">ثبت سریع</button>
    <button data-view="ledger">دفتر امروز</button>
    <button data-view="settings">بیشتر</button>
  </nav>
</div>

<template id="dashboardTpl">
  <section class="dashboardV164">

    <section class="dashboardTopV164">
      <div class="dashboardStatusColV164">
        <div class="sectionTitle sideTitle">وضعیت لحظه‌ای</div>
        <section class="panel sidePanel livePanelV164">
          <div class="sideRow settlementRow"><span>طلای وزنی</span><strong id="sideRawGold">0</strong><div id="actRawGold"></div></div>
          <div class="sideRow settlementRow"><span>تمام سکه</span><strong id="sideFullCoin">بالانس</strong><div id="actFullCoin"></div></div>
          <div class="sideRow settlementRow"><span>نیم سکه</span><strong id="sideHalfCoin">بالانس</strong><div id="actHalfCoin"></div></div>
          <div class="sideRow settlementRow"><span>ربع سکه</span><strong id="sideQuarterCoin">بالانس</strong><div id="actQuarterCoin"></div></div>
          <div class="sideRow"><span>بالانس ارزی</span><strong id="sideFx">0 $</strong></div>
        </section>
      </div>

      <div class="dashboardStatsColV164">
        <section class="cards3 statsGridV164">
          <button class="metric buy" data-action="open-buy">
            <span>خرید امروز</span><strong id="buyToday">0</strong><small>گرم ۱۸ عیار</small>
          </button>
          <button class="metric sell" data-action="open-sell">
            <span>فروش امروز</span><strong id="sellToday">0</strong><small>گرم ۱۸ عیار</small>
          </button>
          <button class="metric gold balanceWideV164" data-action="open-balance">
            <span>بالانس کل ۱۸ عیار</span><strong id="goldBalance">0</strong><small>گرم</small>
          </button>
        </section>

        <button class="advice" id="mainAdvice"></button>
      </div>
    </section>

    <section class="quickSectionV164">
      <div class="sectionTitle">ثبت سریع</div>
      <section class="quickGrid">
        <button data-quick="GOLD"><b>▰</b><span>طلای آبشده</span><small>آبشده / متفرقه</small></button>
        <button data-quick="COIN"><b>●</b><span>سکه</span><small>تمام / نیم / ربع</small></button>
        <button data-quick="USD"><b>$</b><span>دلار</span><small>USD</small></button>
        <button data-quick="AED"><b>د</b><span>درهم</span><small>AED</small></button>
        <button data-quick="EUR"><b>€</b><span>یورو</span><small>EUR</small></button>
        <button data-quick="CUSTOM"><b>＋</b><span>ارز جدید</span><small>افزودن / ثبت</small></button>
      </section>
    </section>

    <section class="dashboardBottomV164">
      <div>
        <div class="sectionTitle sideTitle">خلاصه امروز</div>
        <section class="panel sidePanel" id="todaySummary"></section>
      </div>
      <div>
        <div class="sectionTitle sideTitle">آخرین معاملات</div>
        <section class="panel recentMini" id="recentMini"></section>
      </div>
    </section>

  </section>
</template>

<template id="entryTpl">
  <section class="entryHeader panel">
    <div>
      <h2 id="entryTitle">ثبت سریع</h2>
      <p id="entrySub">نوع دارایی را انتخاب کن</p>
    </div>
  </section>

  <section id="assetChooser" class="panel hidden"></section>

  <section id="coinChooser" class="segRow hidden">
    <button data-coin="تمام سکه" class="active">تمام سکه</button>
    <button data-coin="نیم سکه">نیم سکه</button>
    <button data-coin="ربع سکه">ربع سکه</button>
  </section>

  <label id="normalCoinWrap" class="checkRow hidden">
    <input type="checkbox" id="normalCoin"/> <span>عادی</span>
    <small>پیش‌فرض: بانکی</small>
  </label>

  <section class="segRow buySell">
    <button id="buyBtn" class="active buy">خرید</button>
    <button id="sellBtn" class="sell">فروش</button>
  </section>

  <section class="stepField panel">
    <button id="plusBtn" class="plus" aria-label="افزایش">+</button>
    <div class="qtyCenter">
      <label id="qtyLabel">وزن / تعداد / مقدار</label>
      <input id="qty" type="text" inputmode="none" pattern="[0-9۰-۹.,]*" enterkeyhint="next" autocomplete="off" placeholder="0" dir="ltr" aria-label="مقدار عددی" data-custom-keypad="1">
    </div>
    <button id="minusBtn" class="minus" aria-label="کاهش">−</button>
  </section>

  <div id="chips" class="chips"></div>

  <section class="tabletFormGrid">
    <label class="field panel">
      <span>مبلغ کل (تومان) — اختیاری</span>
      <input id="total" type="text" inputmode="none" enterkeyhint="next" autocomplete="off" dir="ltr" aria-label="مبلغ کل" data-custom-keypad="1">
    </label>

    <label class="field panel">
      <span>نرخ واحد (تومان) — اختیاری</span>
      <input id="unitRate" type="text" inputmode="none" enterkeyhint="next" autocomplete="off" dir="ltr" aria-label="نرخ واحد" data-custom-keypad="1">
    </label>
  </section>

  <div id="autoWeight" class="autoWeight hidden"></div>

  <section class="tabletFormGrid">
    <label class="field panel">
      <span>طرف حساب — اختیاری</span>
      <input id="party" type="text" inputmode="text" enterkeyhint="next" autocomplete="off" lang="fa" dir="rtl" autocapitalize="none" spellcheck="false" aria-label="طرف حساب">
    </label>

    <label class="field panel noteField">
      <span>توضیحات — اختیاری</span>
      <textarea id="note" rows="4" inputmode="text" enterkeyhint="done" autocomplete="off" lang="fa" dir="rtl" autocapitalize="none" spellcheck="false" aria-label="توضیحات"></textarea>
    </label>
  </section>

  <div class="entrySpacer"></div>
  <div id="goldCalcStatus" class="goldCalcStatus"></div>
<button id="saveTrade" class="stickySave">ثبت خرید</button>
</template>

<template id="ledgerTpl">
  <div class="sectionTitle">دفتر امروز</div>
  <div class="filters">
    <button data-filter="ALL" class="active">همه</button>
    <button data-filter="BUY">خرید</button>
    <button data-filter="SELL">فروش</button>
    <button data-filter="UNNAMED">بدون نام</button>
  </div>
  <section id="ledgerList" class="ledgerList"></section>
</template>

<template id="reportTpl">
  <div class="sectionTitle">گزارش و بالانس</div>
  <section id="reportCards" class="reportList"></section>
  <div class="sectionTitle">تسویه‌های داخلی</div>
  <section id="settlementHistory" class="reportList"></section>
</template>

<template id="settingsTpl">
  <div class="sectionTitle">تنظیمات</div>

  <section class="panel">
    <h3>ضرایب تبدیل ارز</h3>
    <div class="settingsGrid">
      <label>دلار / درهم<input id="usdAed" type="text" inputmode="none" pattern="[0-9۰-۹.,]*" enterkeyhint="next" autocomplete="off" dir="ltr" data-custom-keypad="1"></label>
      <label>یورو / دلار<input id="eurUsd" type="text" inputmode="none" pattern="[0-9۰-۹.,]*" enterkeyhint="next" autocomplete="off" dir="ltr" data-custom-keypad="1"></label>
      <label>دلار / ریال قطر<input id="usdQar" type="text" inputmode="none" pattern="[0-9۰-۹.,]*" enterkeyhint="next" autocomplete="off" dir="ltr" data-custom-keypad="1"></label>
      <label>دلار / لیر<input id="usdTry" type="text" inputmode="none" pattern="[0-9۰-۹.,]*" enterkeyhint="next" autocomplete="off" dir="ltr" data-custom-keypad="1"></label>
      <label>ریال عمان / درهم<input id="omrAed" type="text" inputmode="none" pattern="[0-9۰-۹.,]*" enterkeyhint="next" autocomplete="off" dir="ltr" data-custom-keypad="1"></label>
    </div>
    <button id="saveFx" class="secondaryBtn">ذخیره ضرایب</button>
  </section>

  <section class="panel">
    <h3>ارزهای سفارشی</h3>
    <div class="inlineAdd">
      <input id="customCurrencyName" type="text" inputmode="text" enterkeyhint="done" autocomplete="off" lang="fa" dir="rtl" autocapitalize="none" spellcheck="false" placeholder="مثلاً پوند">
      <button id="addCurrencyBtn">افزودن</button>
    </div>
    <div id="currencyList" class="tagList"></div>
  </section>

  <section class="panel">
    <h3>بکاپ اطلاعات</h3>
    <p>بکاپ شامل تمام معاملات، ارزهای سفارشی و ضرایب تبدیل است.</p>
    <div class="twoBtns">
      <button id="exportBtn">خروجی JSON</button>
      <label class="fileBtn">بازیابی JSON<input id="importFile" type="file" accept=".json,application/json"/></label>
    </div>
  </section>

  <section class="panel">
    <h3>مبنای سکه به معادل ۱۸ عیار</h3>
    <p>تمام: ۹٫۷۵۶ گرم<br/>نیم: ۴٫۸۷۸ گرم<br/>ربع: ۲٫۴۳۹ گرم</p>
  </section>
</template>

<script src="app.js?v=166"></script>
</body>
</html>
